function hasSegments(pd) { return !!(pd && pd.segments && pd.segments.length); }

// «Весь текст» выключен — на листе справа не остаётся ничего (раньше
// оставались найденные значения, и казалось, что кнопка скрывает не всё).
// Слева блоки от этой кнопки не зависят: там свой переключатель «Подсветка».
function visibleSegments(pd, side) {
  if (!hasSegments(pd)) return [];
  if (side === 'right' && !_rightTextVisible) return [];
  return pd.segments;
}

// Какие блоки сейчас выделены: под курсором (и все куски того же поля),
// выбранное поле из списка, ячейка таблицы, совпадения поиска.
function activeSegmentIds(pd, links) {
  const ids = new Set();
  if (!hasSegments(pd)) return ids;
  const segs = pd.segments;
  if (state.activeSegment != null) {
    const seg = segs[state.activeSegment];
    if (seg) {
      ids.add(seg.id);
      if (seg.field) segs.forEach(s => { if (s.field === seg.field) ids.add(s.id); });
    }
  }
  const field = getActiveFieldName();
  if (field) segs.forEach(s => { if (s.field === field) ids.add(s.id); });
  if (state.activeLink) {
    segs.forEach(s => {
      if (s.table_cell && s.table_cell.row === state.activeLink.row && s.table_cell.column === state.activeLink.column)
        ids.add(s.id);
    });
  }
  (state.searchIds || []).forEach(id => ids.add(id));
  (state.relatedIds || []).forEach(id => ids.add(id));     // значения наведённой подписи
  if (pinnedOn(pd)) state.pinned.segIds.forEach(id => ids.add(id));   // закреплённый блок
  return ids;
}

// Текст в блоке: крупно, насколько позволяет высота, и сжат по ширине,
// чтобы поместиться целиком — так видно весь текст, а не «Уставн…».
function drawSegmentText(ctx, seg, x, y, w, h, active) {
  const text = String(seg.text || '');
  if (!text || w < 4 || h < 4) return;
  const size = Math.max(5, Math.min(h * 0.8, 18));
  ctx.font = `${seg.kind === 'field' ? 700 : 500} ${size}px Inter, sans-serif`;
  const width = ctx.measureText(text).width || 1;
  const k = Math.min(1, (w - 4) / width);
  ctx.save();
  roundedRectPath(ctx, x, y, w, h, 3);
  ctx.clip();
  ctx.fillStyle = active ? BLOCK.activeText : BLOCK.text;
  ctx.textBaseline = 'middle';
  ctx.translate(x + 2, y + h / 2 + 0.5);
  ctx.scale(k, 1);
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

// solid — блок с заливкой и текстом (белый лист справа или скрытый оригинал
// слева); иначе только рамка поверх скана, чтобы не закрывать документ.
function drawSegmentBlock(ctx, seg, solid, active) {
  const s = scaleBlock(bboxToBlock(seg.bbox));
  const x = s.x - 1, y = s.y - 1, w = s.w + 2, h = s.h + 2;
  ctx.save();
  roundedRectPath(ctx, x, y, w, h, 3);
  if (solid) {
    ctx.fillStyle = active ? BLOCK.activeFill : BLOCK.fill;
    ctx.fill();
  } else if (active) {
    ctx.fillStyle = BLOCK.leftActive;
    ctx.fill();
  }
  if (active) {
    ctx.shadowColor = 'rgba(29,78,216,0.9)';
    ctx.shadowBlur = 10;
  }
  ctx.lineWidth = active ? 2.5 : 1.2;
  ctx.strokeStyle = active ? BLOCK.activeStroke : (solid ? BLOCK.stroke : BLOCK.leftStroke);
  ctx.stroke();
  ctx.restore();
  if (solid) drawSegmentText(ctx, seg, x, y, w, h, active);
}

function drawSegmentsLayer(ctx, pd, links, solid, side) {
  const segs = visibleSegments(pd, side);
  if (!segs.length && !pinnedOn(pd)) return;       // справа текст скрыт и закреплённого блока нет
  const active = activeSegmentIds(pd, links);
  // Блок закреплён (щелчком или по ссылке) — остальное приглушаем, чтобы он
  // сразу бросался в глаза, но было видно, где он стоит на листе
  const dim = pinnedOn(pd);
  ctx.save();
  if (dim) ctx.globalAlpha = 0.3;
  segs.forEach(seg => { if (!active.has(seg.id)) drawSegmentBlock(ctx, seg, solid, false); });
  ctx.restore();
  // выделенные — поверх остальных, чтобы свечение не перекрывали соседи;
  // при скрытом тексте справа — только закреплённый блок
  const shown = segs.length ? pd.segments : pd.segments.filter(seg => isPinnedSeg(pd, seg));
  shown.forEach(seg => { if (active.has(seg.id)) drawSegmentBlock(ctx, seg, solid, true); });
  if (dim && state.pinned.raw) drawPinnedRaw(ctx, state.pinned.raw);
}

// ── Строка текста над документом ───────────────────────────────
function isNumberText(t) { return /^[\s\d.,()\-—]+$/.test(String(t || '')) && /\d/.test(String(t || '')); }

// Переключатель: вид (ползунок, цвет, «вкл/выкл») и aria-pressed — по состоянию
function setSwitch(id, on) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.classList.toggle('active', !!on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
}

// «Связанные значения» при каждом открытии выключены — включают их сами,
// когда нужно. Выбор не запоминается.
state.showLinks = false;

function syncLinksToggle() { setSwitch('linksToggle', state.showLinks); }

syncLinksToggle();

function toggleLinkedValues() {
  state.showLinks = !state.showLinks;
  syncLinksToggle();
  // сразу перерисовать строку для блока, на который уже наведён курсор
  if (state.lastFocus) setFocus(...state.lastFocus);
}

// Строка над документом. Когда «Связанные значения» выключены, выводится
// только текст блока: без серой подписи (показатель, код, графа) и без
// значений. Подсветка на листах от кнопки не зависит.
function setFocus(context, text, values) {
  state.lastFocus = [context, text, values];
  if (!state.showLinks) { context = ''; values = []; }
  const ctxEl = document.getElementById('focusContext');
  const txtEl = document.getElementById('focusText');
  const valEl = document.getElementById('focusValues');
  if (valEl) {
    valEl.innerHTML = (text && values && values.length)
      ? values.map(v => `<span class="focus-chip">${v.label ? escHtml(v.label) + ':' : 'Значение:'}<b>${escHtml(v.value)}</b></span>`).join('')
      : '';
  }
  if (!ctxEl || !txtEl) return;
  if (!text) {
    ctxEl.textContent = '';
    txtEl.className = 'focus-text';
    txtEl.innerHTML = '<span class="focus-hint">Наведите на любой блок документа — здесь появится его текст</span>';
    return;
  }
  ctxEl.textContent = context || '';
  txtEl.className = 'focus-text' + (isNumberText(text) ? ' number' : '');
  txtEl.textContent = text;
}

// Подпись к ячейке таблицы: строка (название, код) и графа (заголовок)
function tableCellContext(pd, cell) {
  const t = pd && pd.table;
  if (!t || !cell) return '';
  const row = t.rows.find(r => r.index === cell.row);
  const col = t.columns.find(c => c.index === cell.column);
  if (!row || !col) return '';
  if (row.kind === 'header' || row.kind === 'numbering') return 'Заголовок графы таблицы';
  if (row.kind === 'section') return 'Раздел таблицы';
  if (row.kind === 'other') return '';
  const parts = [];
  if (col.role === 'label') parts.push('Показатель');
  else if (col.role === 'code') parts.push('Код строки');
  if (col.role !== 'label' && row.label) parts.push(row.label);
  if (row.code && col.role !== 'code') parts.push('код ' + row.code);
  if (col.role === 'value' && col.header) parts.push(col.header);
  return parts.join(' · ');
}

function focusForField(fieldName) {
  const parsed = getCurrentParsed();
  const link = getCurrentLinks()[fieldName];
  const label = getFieldColor(fieldName).label || fieldName.replace('extra::', '');
  const context = link
    ? [link.row_label, link.row_code ? 'код ' + link.row_code : '', link.column_header].filter(Boolean).join(' · ')
    : label;
  const value = getFieldValue(fieldName, parsed);
  setFocus(context, link ? tidyNumber(value) : value);    // в таблице — число без обрывков линейки
}

function focusForSegment(pd, seg) {
  state.relatedIds = [];
  if (!seg) { setFocus('', ''); return; }
  if (seg.field) { focusForField(seg.field); return; }
  const rel = relatedForSegment(pd, seg);
  state.relatedIds = rel.ids;
  if (seg.kind === 'cell') {
    setFocus(rel.context || tableCellContext(pd, seg.table_cell) || 'Текст документа', seg.text, rel.values);
    return;
  }
  const unsure = seg.confidence != null && seg.confidence < 50 ? ' · распознано неуверенно' : '';
  setFocus(rel.context || ('Текст документа' + unsure), seg.text, rel.values);
}

// Что связано с блоком-подписью: у названия показателя — его значения по
// графам, у реквизита («Организация») — его значение. Возвращает блоки,
// которые надо подсветить вместе с подписью, и значения для строки сверху.
function normLabel(t) {
  return String(t || '').toLowerCase().replace(/[:\s.]+$/, '').replace(/\s+/g, ' ').trim();
}

// Число из графы значений без обрывков линейки, которые OCR дописывает
// к краю: «(1 066)!», «(594):», «2489]», «|176». Цифры не трогаем; скобку
// отрицательного числа, потерянную с одного края, возвращаем: «250)» →
// «(250)». Текст без цифр (прочерк, слова) выводится как есть.
function tidyNumber(text) {
  const src = String(text || '').trim();
  if (/^[\-—–_\s]+$/.test(src)) return '—';            // прочерк: «——», «—_-»
  if (!/\d/.test(src)) return src;
  let t = src.replace(/^[^\d(\-—–]+/, '').replace(/[^\d)]+$/, '');
  // Обрезаем только мусор вокруг числа: «лизинг (код ОКЭД 64910)» — не число
  if (!/^[\d\s.,()\-—–]+$/.test(t) || src.length - t.length > 3) return src;
  const open = t.startsWith('('), close = t.endsWith(')');
  if (open && !close) t += ')';
  else if (close && !open) t = '(' + t;
  return t;
}

function relatedForSegment(pd, seg) {
  const out = { ids: [], values: [], context: null };
  if (!pd || !seg || seg.kind === 'field') return out;
  const t = pd.table;

  // 1. Название показателя — значения его строки по всем графам
  if (t && seg.table_cell && seg.table_cell.column === t.label_column) {
    const row = t.rows.find(r => r.index === seg.table_cell.row);
    if (row && (row.kind === 'item' || row.kind === 'total')) {
      t.columns.filter(c => c.role === 'value').forEach(c => {
        const segs = pd.segments.filter(s => s.table_cell && s.table_cell.row === row.index && s.table_cell.column === c.index);
        segs.forEach(s => out.ids.push(s.id));
        const cell = row.cells.find(x => x.column === c.index);
        const text = tidyNumber(segs.length ? segs.map(s => s.text).join(' ') : (cell ? cell.text : ''));
        out.values.push({
          label: c.header || c.period || ('Графа ' + (c.number || c.index + 1)),
          value: text || '—',
        });
      });
      return out;
    }
  }

  // 2. Подпись, для которой найдено поле с таким же названием
  //    («Организация» → «ОАО "Витмил"», «Сумма:» → «258.00 BYN»)
  const key = normLabel(seg.text);
  const fieldKeys = [...new Set(pd.segments.filter(s => s.field).map(s => s.field))];
  const match = key && fieldKeys.find(k => normLabel(getFieldColor(k).label || k.replace('extra::', '')) === key);
  if (match) {
    pd.segments.filter(s => s.field === match).forEach(s => out.ids.push(s.id));
    out.values.push({ label: '', value: getFieldValue(match, getCurrentParsed()) || '—' });
    return out;
  }

  // 3. Строка реквизитов в разлиновке над таблицей: слева подпись, правее значение
  if (t && seg.table_cell) {
    const row = t.rows.find(r => r.index === seg.table_cell.row);
    if (row && row.kind === 'other') {
      const y0 = row.bbox.y, y1 = row.bbox.y + row.bbox.h;
      const inRow = pd.segments
        .filter(s => { const cy = s.bbox.y + s.bbox.h / 2; return cy >= y0 && cy < y1; })
        .sort((a, b) => a.bbox.x - b.bbox.x);
      if (inRow.length && inRow[0].id === seg.id) {
        const rest = inRow.slice(1);
        rest.forEach(s => out.ids.push(s.id));
        out.values.push({ label: '', value: rest.length ? rest.map(s => s.text).join(' ') : 'значение не указано' });
      } else if (inRow.length) {
        out.context = inRow[0].text;           // значение реквизита: сверху — его подпись
        out.ids.push(inRow[0].id);
      }
    }
  }
  return out;
}

// ════════════════════════════════════════════════
// ССЫЛКА НА БЛОК: /view?id=<ID разбора>&block=<ID блока>
// У каждого блока итогового JSON есть block_id (p1-b42), у блоков, строк и
// слов сырого JSON — id (p1-r3, p1-r3-l2, p1-r3-l2-w5). По ссылке просмотр
// открывает нужную страницу, выделяет блок, приглушает остальное и
// прокручивает к нему. Щелчок по блоку на листе закрепляет его так же —
// тогда над документом появляется кнопка «Ссылка на блок».
// ════════════════════════════════════════════════

// state.pinned: null | { page, blockId, segId, segIds, raw: null | { id, bbox, text } }
state.pinned = null;

const BLOCK_RE = /^p(\d+)-b(\d+)$/;
const RAW_BLOCK_RE = /^p(\d+)-r\d+(?:-l\d+(?:-w\d+)?)?$/;

// ID блока; у разбора, выгруженного до появления ID, — тот же по номеру
function segBlockId(pd, seg) { return seg.block_id || `p${pd.number}-b${seg.id}`; }
function pinnedOn(pd) { return !!(state.pinned && pd && pd.number === state.pinned.page); }
function isPinnedSeg(pd, seg) { return pinnedOn(pd) && state.pinned.segIds.includes(seg.id); }

function togglePinSegment(pd, segId) {
  const seg = pd && pd.segments[segId];
  if (!seg) return;
  if (pinnedOn(pd) && !state.pinned.raw && state.pinned.segId === segId) { unpinBlock(); return; }
  pinSegment(pd, seg);
}

function pinSegment(pd, seg) {
  state.pinned = { page: pd.number, blockId: segBlockId(pd, seg), segId: seg.id, segIds: [seg.id], raw: null };
  renderBlockPin(); focusPinned(); redrawCanvas(); redrawAnnotation();
}

function unpinBlock() {
  state.pinned = null;
  state.relatedIds = [];
  renderBlockPin(); setFocus('', ''); redrawCanvas(); redrawAnnotation();
}

function renderBlockPin() {
  const box = document.getElementById('blockPin');
  if (!box) return;
  box.classList.toggle('visible', !!state.pinned);
  document.getElementById('blockPinId').textContent = state.pinned ? state.pinned.blockId : '';
}

// Над документом — закреплённый блок: его текст (и связанные значения)
function focusPinned() {
  const p = state.pinned;
  if (!p) return;
  if (p.raw) {
    state.relatedIds = [];
    setFocus('Сырой JSON · ' + p.raw.id, p.raw.text, []);
    return;
  }
  const pd = pageDataOf(state.results[state.currentResFileIdx], p.page - 1);
  const seg = pd && pd.segments[p.segId];
  if (seg) focusForSegment(pd, seg);
}

function copyBlockLink() {
  const res = state.results[state.currentResFileIdx];
  if (!state.pinned || !res) return;
  const url = viewLink(res.parse_id) + '&block=' + encodeURIComponent(state.pinned.blockId);
  copyText(url, 'Ссылка на блок ' + state.pinned.blockId + ' скопирована');
}

function goToPage(idx) {
  if (idx === state.currentPageIdx) return;
  state.currentPageIdx = idx;
  showPreview(); updateNavButtons(); syncResultToPreview();
}

// Прокрутить так, чтобы блок оказался посередине видимой части листа
// (под закреплённой строкой и панелью кнопок)
function scrollToBox(bbox) {
  const img = document.getElementById('previewImg');
  const go = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    const s = scaleBlock(bboxToBlock(bbox));
    const y = img.getBoundingClientRect().top + window.scrollY + s.y + s.h / 2;
    const covered = 112 + 46;                       // строка над документом + панель кнопок
    window.scrollTo({ top: Math.max(0, y - (covered + window.innerHeight) / 2), behavior: 'smooth' });
    redrawCanvas(); redrawAnnotation();
  }));
  if (img.complete && img.naturalWidth) go();
  else img.addEventListener('load', go, { once: true });
}

// Сырой JSON разбора — у сервиса или из папки рядом (GitHub)
async function loadRaw(parseId) {
  const raw = STATIC_DATA ? await fetchJsonFile('raw/' + parseId + '.json')
                          : await apiJson('/api/v1/parses/' + encodeURIComponent(parseId) + '/raw');
  // ID по порядку блоков, строк и слов — те же, что ставит сервис; нужны
  // для сырого JSON, выгруженного до их появления
  (raw.pages || []).forEach(page => (page.blocks || []).forEach((b, bi) => {
    b.id = b.id || `p${page.number}-r${bi + 1}`;
    (b.lines || []).forEach((l, li) => {
      l.id = l.id || `${b.id}-l${li + 1}`;
      (l.words || []).forEach((w, wi) => { w.id = w.id || `${l.id}-w${wi + 1}`; });
    });
  }));
  return raw;
}

// Блок, строка или слово сырого JSON -> { id, bbox, words }
function findRawNode(page, id) {
  for (const b of page.blocks || []) {
    const lines = b.lines || [];
    if (b.id === id) return { id, bbox: b.bbox, words: lines.flatMap(l => l.words || []) };
    for (const l of lines) {
      if (l.id === id) return { id, bbox: l.bbox, words: l.words || [] };
      for (const w of l.words || []) {
        if (w.id === id) return { id, bbox: { x: w.x, y: w.y, w: w.w, h: w.h }, words: [w] };
      }
    }
  }
  return null;
}

function centerInside(a, b) {
  const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
  return cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h;
}

function blockNotFound(ref) {
  showToast(`Блок «${ref}» в этом разборе не найден`, 'error');
}

// Открыть блок из ссылки: блок итогового JSON (p1-b42) или сырого (p1-r3…)
async function openBlock(parseId, ref) {
  ref = String(ref || '').trim().toLowerCase();
  const res = state.results[state.currentResFileIdx];
  let m = ref.match(BLOCK_RE);
  if (m) {
    const pd = pageDataOf(res, +m[1] - 1);
    const seg = pd && (pd.segments.find(s => s.block_id === ref) || pd.segments[+m[2]]);
    if (!seg) return blockNotFound(ref);
    goToPage(pd.number - 1);
    pinSegment(pd, seg);
    scrollToBox(seg.bbox);
    return;
  }
  m = ref.match(RAW_BLOCK_RE);
  if (!m) return blockNotFound(ref);
  let raw;
  try { raw = await loadRaw(parseId); }
  catch (e) { showToast('Сырой JSON не загрузился: ' + e.message, 'error'); return; }
  const page = (raw.pages || []).find(p => p.number === +m[1]);
  const node = page && findRawNode(page, ref);
  const pd = pageDataOf(res, +m[1] - 1);
  if (!node || !pd) return blockNotFound(ref);
  // Блоки итогового JSON, собранные из этих слов: по raw_words, а у разбора
  // без них — по положению на листе
  const wordIds = node.words.map(w => w.id);
  const linked = pd.segments.some(s => Array.isArray(s.raw_words));
  const segIds = pd.segments.filter(s => linked
      ? (s.raw_words || []).some(id => wordIds.includes(id))
      : node.words.some(w => centerInside({ x: w.x, y: w.y, w: w.w, h: w.h }, s.bbox)))
    .map(s => s.id);
  goToPage(pd.number - 1);
  state.pinned = { page: pd.number, blockId: node.id, segId: null, segIds,
                   raw: { id: node.id, bbox: node.bbox, text: node.words.map(w => w.text).join(' ') } };
  renderBlockPin(); focusPinned(); redrawCanvas(); redrawAnnotation();
  scrollToBox(node.bbox);
}

// Рамка блока сырого JSON — пунктиром поверх листа
function drawPinnedRaw(ctx, raw) {
  const s = scaleBlock(bboxToBlock(raw.bbox));
  ctx.save();
  ctx.fillStyle = 'rgba(245,158,11,0.12)';
  ctx.fillRect(s.x - 4, s.y - 4, s.w + 8, s.h + 8);
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(245,158,11,1)';
  ctx.strokeRect(s.x - 4, s.y - 4, s.w + 8, s.h + 8);
  ctx.restore();
}

// Esc снимает закреплённый блок (во фрейме — раньше, чем закрыть фрейм)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.pinned) { e.preventDefault(); unpinBlock(); }
});

// Наведение на блок — на любом из листов
function onSegmentEnter(side, id) {
  const pd = side === 'left' ? getPreviewPageData() : getCurrentPageData();
  const seg = pd && pd.segments[id];
  state.activeSegment = id;
  state.activeField = null; state.activeBlock = null; state.activeLink = null;
  focusForSegment(pd, seg);                 // заодно находит связанные блоки
  redrawCanvas(); redrawAnnotation();
}

function onSegmentLeave() {
  state.activeSegment = null;
  state.relatedIds = [];
  redrawCanvas(); redrawAnnotation();
  // Ушли с блока — над документом снова закреплённый блок, если он есть
  if (state.pinned) focusPinned(); else setFocus('', '');
}

function toggleRightText() {
  _rightTextVisible = !_rightTextVisible;
  setSwitch('btnToggleText', _rightTextVisible);
  redrawCanvas();
  redrawAnnotation();
  rebuildOcrHitLayer();
}

function drawAnnotationCanvas(mapping, parsed) {
  const img    = document.getElementById('previewImg');
  const wrap   = document.getElementById('annotationWrap');
  const sheet  = document.getElementById('annotationSheet');
  const canvas = document.getElementById('annotationCanvas');

  if (!img || !img.naturalWidth) {
    // Изображение ещё не загружено — подождём
    img.addEventListener('load', () => drawAnnotationCanvas(mapping, parsed), { once: true });
    return;
  }

  // Синхронизируем размеры с левым изображением точно
  const dispW = img.offsetWidth;
  const dispH = img.offsetHeight;

  sheet.style.width  = dispW + 'px';
  sheet.style.height = dispH + 'px';
  wrap.style.width   = dispW + 'px';
  wrap.style.height  = dispH + 'px';

  const dpr = window.devicePixelRatio || 1;
  canvas.width  = dispW * dpr;
  canvas.height = dispH * dpr;
  canvas.style.width  = dispW + 'px';
  canvas.style.height = dispH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, dispW, dispH);

  const pageData = getCurrentPageData();
  drawTableLink(ctx, pageData, getActiveLink(getCurrentLinks()));

  // Весь текст страницы блоками одного цвета (формат 1.2). У старых
  // разборов блоков нет — для них рисуем, как раньше, только найденные поля.
  if (hasSegments(pageData)) {
    drawSegmentsLayer(ctx, pageData, getCurrentLinks(), true, 'right');
    return;
  }
  if (!_rightTextVisible) return;                 // «Весь текст» выключен — лист пустой
  if (pageData) drawAllWords(ctx, pageData.words);

  if (!mapping || Object.keys(mapping).length === 0) return;

  // Используем те же scaleBlock/drawBaseBlocks что и левый canvas —
  // state.imgDisplayW/H уже выставлены правильно для левого изображения.
  // Справа оригинала документа никогда нет (это всегда синтетический белый
  // лист), поэтому тексту внутри рамок мешать нечему — показываем его всегда.
  const resolvedParsed = parsed || getCurrentParsed();
  drawBaseBlocks(ctx, mapping, resolvedParsed, true);

  // То же наведение, что и слева (getActiveFieldName) — чтобы при hover на
  // блок или на строку в списке справа подсветка "вспыхивала" ОДИНАКОВО
  // на обеих сторонах, а не только на левой.
  const fieldName = getActiveFieldName();
  if (fieldName) drawEmphasis(ctx, mapping, fieldName, resolvedParsed);
}

// Переключить видимость оригинального изображения слева
function toggleLeftBg() {
  _leftBgVisible = !_leftBgVisible;
  const img = document.getElementById('previewImg');
  const btn = document.getElementById('btnToggleLeft');
  if (img) img.style.opacity = _leftBgVisible ? '1' : '0';
  setSwitch(btn.id, _leftBgVisible);
  // От видимости оригинала зависит, пишем ли текст внутри рамок слева
  // (см. drawBaseBlocks/redrawCanvas) — перерисовываем сразу же.
  redrawCanvas();
}

// Переключить видимость подсветки (найденных блоков+подписей) слева —
// независимо от оригинала: иногда нужно увидеть ЧИСТЫЙ документ, когда
// подписи наезжают на текст и мешают читать.
let _leftHighlightVisible = true;
function toggleLeftHighlight() {
  _leftHighlightVisible = !_leftHighlightVisible;
  setSwitch('btnToggleLeftHighlight', _leftHighlightVisible);
  redrawCanvas();
}

// Переключить видимость белого фона справа
function toggleRightBg() {
  _rightBgVisible = !_rightBgVisible;
  const sheet = document.getElementById('annotationSheet');
  const btn   = document.getElementById('btnToggleRight');
  if (sheet) sheet.classList.toggle('hidden', !_rightBgVisible);
  setSwitch(btn.id, _rightBgVisible);
}

// Перерисовываем правый canvas при ресайзе
window.addEventListener('resize', () => {
  const mapping = getCurrentMapping();
  if (mapping) drawAnnotationCanvas(mapping);
});

// ════════════════════════════════════════════════
// RESULTS SEARCH
// (примечание: раньше здесь был отдельный переключатель "подсветить всё" —
// теперь все блоки и так всегда видны и слева, и справа, поэтому он не нужен;
// resetHlAll() оставлен как пустая заглушка, чтобы не трогать вызовы ниже)
// ════════════════════════════════════════════════
function resetHlAll() {}
function searchResultFields(query) {
  // Раньше искало по элементам #bricksGrid .brick — таких элементов нет
  // и не было в разметке (незавершённая фича), поэтому поиск всегда молча
  // находил 0 совпадений. Теперь ищет напрямую по маппингу полей —
  // по названию поля, подписи и распознанному значению.
  const q = query.trim().toLowerCase();
  const clearBtn = document.getElementById('resultsSearchClear');
  clearBtn.style.display = q ? 'block' : 'none';

  const mapping = getCurrentMapping() || {};
  const parsed  = getCurrentParsed();
  const fieldNames = Object.keys(mapping);
  const total = fieldNames.length;
  const matchedFields = [];

  fieldNames.forEach(fieldName => {
    const color = getFieldColor(fieldName);
    const label = (color.label || (fieldName.startsWith('extra::') ? fieldName.replace('extra::', '') : fieldName)).toLowerCase();
    const value = getFieldValue(fieldName, parsed).toLowerCase();
    const hits = q === '' || fieldName.toLowerCase().includes(q) || label.includes(q) || value.includes(q);
    if (hits && q !== '') matchedFields.push(fieldName);
  });

  // База (все блоки) всегда на месте и слева, и справа — поверх акцент на
  // найденных по поиску, одинаково с обеих сторон. Текст внутри рамки —
  // как и везде — слева только если оригинал скрыт, справа всегда.
  // Есть блоки всего текста — ищем по ним: по тексту блока и по названию поля
  const pdSearch = getCurrentPageData();
  if (hasSegments(pdSearch)) {
    state.searchIds = q === '' ? [] : visibleSegments(pdSearch).filter(sg => {
      const label = sg.field ? (getFieldColor(sg.field).label || sg.field.replace('extra::', '')).toLowerCase() : '';
      return String(sg.text || '').toLowerCase().includes(q) || label.includes(q);
    }).map(sg => sg.id);
    redrawCanvas(); redrawAnnotation();
    document.getElementById('resultsSearchCount').textContent =
      q === '' ? '' : `${state.searchIds.length}/${visibleSegments(pdSearch).length}`;
    return;
  }
  state.searchIds = [];

  const leftCanvas  = document.getElementById('highlightCanvas');
  const rightCanvas = document.getElementById('annotationCanvas');
  [[leftCanvas, !_leftBgVisible], [rightCanvas, true]].forEach(([canvas, drawText]) => {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (canvas === rightCanvas && _rightTextVisible) {
      const pd = getCurrentPageData();                 // весь текст — и во время поиска
      if (pd) drawAllWords(ctx, pd.words);
    }
    if (total > 0) {
      drawBaseBlocks(ctx, mapping, parsed, drawText);
      if (q !== '') matchedFields.forEach(fn => drawEmphasis(ctx, mapping, fn, parsed));
    }
  });

  const countEl = document.getElementById('resultsSearchCount');
  countEl.textContent = q === '' ? '' : `${matchedFields.length}/${total}`;
}

function clearResultSearch() {
  const input = document.getElementById('resultsSearchInput');
  input.value = '';
  searchResultFields('');
}

// LOG

let logLines = 0;
function addLog(msg, type='info') {
  const body = document.getElementById('logBody');
  const ts   = new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const div  = document.createElement('div');
  div.className = 'log-line ' + type;
  div.innerHTML = `<span class="ts">${ts}</span><span class="msg">${escHtml(msg)}</span>`;
  body.appendChild(div); body.scrollTop = body.scrollHeight;
  logLines++;
  document.getElementById('logCount').textContent = logLines + ' записей';
}
function clearLog() {
  logLines = 0; document.getElementById('logBody').innerHTML = '';
  document.getElementById('logCount').textContent = '0 записей';
}
function toggleLog() {
  state.logCollapsed = !state.logCollapsed;
  document.getElementById('logBody').classList.toggle('hidden', state.logCollapsed);
  document.getElementById('logToggle').classList.toggle('collapsed', state.logCollapsed);
}

// ВЫГРУЗКА
// ════════════════════════════════════════════════
function exportJSON() {
  const res = state.results[state.currentResFileIdx];
  if (!res) return;
  // Выгружаем результат ровно в том виде, в каком его отдаёт сервис разбора
  saveJsonFile(res.raw || res, `result_${res.filename || 'document'}.json`);
  showToast('JSON сохранён', 'success');
}

function exportRawJSON() {
  const res = state.results[state.currentResFileIdx];
  const file = state.files[state.currentResFileIdx];
  const id = (file && file.parseId) || (res && res.raw && res.raw.id);
  if (!id) { showToast('У этого результата нет ID разбора', 'info'); return; }
  downloadRawJson(id, (res && res.filename) || (file && file.name));
}

function copyResult() {
  const res = state.results[state.currentResFileIdx];
  if (!res) return;
  navigator.clipboard.writeText(JSON.stringify(res.parsed_list[state.currentResPageIdx], null, 2))
    .then(()=>showToast('Скопировано', 'success'))
    .catch(()=>showToast('Ошибка копирования', 'error'));
}

// Встроен во фрейм: Esc внутри просмотра сообщаем странице снаружи — пусть
// решает сама (страница разбора закрывает окно). О самой этой странице
// просмотр ничего не знает: только отправляет событие. Встроить просмотр
// может и чужая страница с другого адреса (или открытая с диска), поэтому
// сообщение уходит любому родителю: в нём нет данных, только «нажали Esc».
if (window.parent !== window) {
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !e.defaultPrevented) window.parent.postMessage({ source: 'dokanaliz-view', event: 'escape' }, '*');
  });
}
