# ДокАнализ: веб-интерфейс + сервис разбора.
#
# Сервис разбора живёт в отдельном репозитории dokanaliz-parser, который
# должен лежать рядом с этим:
#
#   ~/document-classification-system   ← этот репозиторий (веб-интерфейс)
#   ~/dokanaliz-parser                 ← сервис разбора
#
#   docker compose up --build      # собрать и запустить оба сервиса
#   http://localhost:5000          # веб-интерфейс
#   http://localhost:8000/api/v1   # API сервиса разбора

include:
  - ../dokanaliz-parser/docker-compose.yml

services:
  # Веб-интерфейс: страница загрузки и просмотра. О разборе знает только API.
  web:
    build: ./web_client
    image: dokanaliz-web
    ports:
      - "5000:5000"
    environment:
      - PARSER_URL=http://parser:8000
    depends_on:
      - parser
